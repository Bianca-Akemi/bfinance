name: s_mobills
description: Control your finances
version: 1.3.0+5
publish_to: none

environment:
  sdk: "^3.8.0"

dependencies:
  animated_text_kit: ^4.2.2
  bloc: ^9.2.0
  collection: ^1.18.0
  currency_textfield: ^4.5.0
  dio: ^5.9.2
  dio_cache_interceptor: ^3.2.7
  dio_cache_interceptor_hive_store: ^3.1.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_expandable_fab: ^2.0.0
  flutter_flavor: ^3.1.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^3.1.0
  get_it: ^7.7.0
  go_router: ^13.2.4
  grouped_list: ^5.1.2
  intl: ^0.20.2
  json_annotation: ^4.5.0
  path_provider: ^2.0.10
  shared_preferences: ^2.2.3
  skeletonizer: ^2.1.3
  syncfusion_flutter_charts: ^28.1.38

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: "^0.13.1"
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.2.0
  mocktail: ^1.0.3
  very_good_analysis: ^5.1.0

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: lib/resources/fonts/Poppins-Light.ttf
          weight: 300
        - asset: lib/resources/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: lib/resources/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: lib/resources/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: lib/resources/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: lib/resources/fonts/Poppins-Italic.ttf
          style: italic
  assets:
    - lib/resources/icons/empty_bank_accounts.png
    - lib/resources/icons/empty_transactions.png
    - lib/resources/icons/logo.png
    - lib/resources/icons/splash_logo.png
  uses-material-design: true
  generate: true
